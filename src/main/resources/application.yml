spring:
  application:
    name: ledgerline
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/ledgerline}
    username: ${DB_USER:ledgerline}
    password: ${DB_PASSWORD:ledgerline}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
