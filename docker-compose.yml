services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
    ports:
      - "5432:5432"
    volumes:
      - ledgerline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline -d ledgerline"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      JDBC_URL: jdbc:postgresql://db:5432/ledgerline
      DB_USER: ledgerline
      DB_PASSWORD: ledgerline
    ports:
      - "8080:8080"

volumes:
  ledgerline_pgdata:
